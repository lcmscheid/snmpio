name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ADR-0002: both Asio flavours are built on every commit -- Boost.Asio is the default, but the
  # untested one rots, and because the choice appears in every public signature it cannot be
  # repaired later without a break.
  #
  # The TSan cell is on clang-20 rather than the runner's clang 18, which predates the fix for
  # llvm#72006 -- clang touching a coroutine frame after it suspends, a race of the compiler's own
  # making (research note 3.4). This Ubuntu's Asio is 1.28.1, whose fences TSan cannot see;
  # CMakeLists.txt says how the TSan build deals with that, and the configure log says it did.
  build:
    name: ${{ matrix.compiler }} / ${{ matrix.asio }}${{ matrix.sanitizer != 'none' && format(' / {0}', matrix.sanitizer) || '' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        asio: [boost, standalone]
        sanitizer: [none]
        include:
          - compiler: clang
            asio: boost
            sanitizer: asan+ubsan
          - compiler: clang-20
            asio: boost
            sanitizer: tsan
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtest-dev libssl-dev
          if [ "${{ matrix.asio }}" = "boost" ]; then
            sudo apt-get install -y libboost-system-dev
          else
            sudo apt-get install -y libasio-dev
          fi
          if [ "${{ matrix.compiler }}" = "clang-20" ]; then
            sudo apt-get install -y clang-20 libclang-rt-20-dev
          fi

      # The runner's 32 bits of mmap randomisation put mappings where TSan's shadow memory expects
      # none, and it can die at startup with "unexpected memory mapping"
      # (actions/runner-images#9491). 28 is the kernel's old default.
      - name: Narrow ASLR for TSan
        if: matrix.sanitizer == 'tsan'
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.sanitizer != 'none' && 'Debug' || 'RelWithDebInfo' }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.compiler == 'gcc' && 'g++' || matrix.compiler == 'clang-20' && 'clang++-20' || 'clang++' }} \
            -DSNMP_USE_BOOST_ASIO=${{ matrix.asio == 'boost' && 'ON' || 'OFF' }} \
            -DSNMPIO_SANITIZE=${{ matrix.sanitizer == 'asan+ubsan' && 'ON' || 'OFF' }} \
            -DSNMPIO_TSAN=${{ matrix.sanitizer == 'tsan' && 'ON' || 'OFF' }} \
            -DSNMPIO_WERROR=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  fuzz:
    name: fuzz (smoke)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang libasio-dev libssl-dev

      - name: Build fuzzers
        run: |
          cmake -S . -B build-fuzz -G Ninja \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DSNMPIO_BUILD_TESTS=OFF \
            -DSNMPIO_BUILD_FUZZERS=ON
          cmake --build build-fuzz

      # The fuzzers' asserts are their oracles and are live whatever the build type
      # (fuzz/CMakeLists.txt), so the seed corpus is replayed on its own first: a regression an
      # existing seed already reaches fails here, by name, before any mutation is involved.
      - name: Replay the seed corpus
        run: |
          for fuzzer in build-fuzz/fuzz/Fuzz*; do
            "$fuzzer" fuzz/corpus -runs=0
          done

      # A short run per commit, so a regression that the seed corpus already covers is caught
      # immediately. Long campaigns belong in a scheduled job, not on the PR path.
      - name: Fuzz
        run: |
          mkdir -p .fuzz-work
          for fuzzer in build-fuzz/fuzz/Fuzz*; do
            "$fuzzer" .fuzz-work fuzz/corpus -max_total_time=60 -print_final_stats=1
          done

      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: |
            crash-*
            leak-*
            timeout-*
          if-no-files-found: ignore

  # The only jobs that send a real datagram to an Agent nobody here wrote. Everything else in this
  # workflow talks to the Scripted Agent, which shares our own reading of the protocol, so a
  # misreading of RFC 3416 would pass every other job here. Agents that disagree with us are better
  # evidence than one that agrees: `snmpd`, and two images of our own Simulator. All three speak
  # AES-192/256 under either Key Extension scheme, so each scheme is read by an implementation that
  # is not ours as well as by one that is (ADR-0006).
  #
  # It runs compliant against all of them, and then -- against the Simulators alone -- misbehaving:
  # the boots/time comparison, the Walk's two guards and the decoder's refusal of malformed input
  # are reachable no other way, because a correct Agent never produces any of them.
  #
  # tests/interop/start-agent.sh starts each Agent, exactly as it does on a workstation, and says
  # everything about it this job needs: where each Agent is pinned, why there are two Simulators,
  # and each Agent's capability flags. None of that is repeated here, so the two cannot drift, and
  # a failure here is reproduced with the one command the job ran.
  #
  # One cell runs the suite from an ASan+UBSan build against snmpd: replies from an Agent we did not
  # write drive the decoder and the Client down paths the Scripted Agent never takes, and this is
  # where a memory error on one of them would show.
  interop:
    name: interop (${{ matrix.agent }}${{ matrix.sanitizer != 'none' && format(' / {0}', matrix.sanitizer) || '' }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        agent: [snmpd, simulator, simulator-release]
        sanitizer: [none]
        include:
          - agent: snmpd
            sanitizer: asan+ubsan
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libboost-system-dev libgtest-dev libssl-dev

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DSNMPIO_WERROR=ON \
            ${{ matrix.sanitizer == 'asan+ubsan' && '-DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=clang++ -DSNMPIO_SANITIZE=ON' || '' }}
          cmake --build build

      # It returns once the Agent answers, and fails with the Agent's log if it never does. The
      # password is the script's default: it authorizes a loopback Agent this job starts and kills.
      - name: Start the Agent
        run: tests/interop/start-agent.sh ${{ matrix.agent }} >> "$GITHUB_ENV"

      # -R Interop is the live half only, and every test in it needs an Agent -- so a green run
      # here means Responses actually came back. These tests skip when their environment is
      # missing, which here is what the step above wrote -- drop that and this job goes green
      # having proved nothing.
      - name: Interop
        run: ctest --test-dir build -R Interop --verbose --no-tests=error

      # The second way in, over the same Agent: `netops-legacy` is a user of snmpd-conf.sh's whose
      # name says nothing about what it carries, and `netops-ro` a community other than `public`,
      # which is what a Target we did not configure looks like. Without this the path is
      # documented and never run.
      - name: Interop, addressing a user and a community by name
        if: matrix.agent == 'snmpd'
        env:
          SNMPIO_INTEROP_COMMUNITY: netops-ro
          SNMPIO_INTEROP_V3_USER: netops-legacy
          SNMPIO_INTEROP_V3_AUTH: sha256
          SNMPIO_INTEROP_V3_PRIV: aes
        run: ctest --test-dir build -R 'Interop(V2c|V3)' --verbose --no-tests=error

      - name: Agent log
        if: failure()
        run: docker logs snmpio-interop

  package:
    name: install + consume
    runs-on: ubuntu-24.04
    # The examples are a separate CMake project that find_package()s an installed snmpio, so
    # building them here is the only thing that exercises the install rules and
    # snmpioConfig.cmake. A consumer whose build broke would otherwise find out before we did.
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libboost-system-dev libssl-dev

      - name: Build and install
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DSNMPIO_BUILD_TESTS=OFF -DSNMPIO_WERROR=ON
          cmake --build build
          cmake --install build --prefix "$RUNNER_TEMP/prefix"

      - name: Build the examples against it
        run: |
          cmake -S examples -B build/examples -G Ninja \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/prefix" -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build build/examples

      # Standard-library hardening is PRIVATE to our own targets: choosing it for a consumer would
      # be choosing their build flags. So the library must compile with it and the examples, which
      # see only what the installed package exports, must not. grep exits 1 for "no match" and 2 for
      # a file it could not read, and only the first is a pass -- a missing file proves nothing.
      - name: Hardening stays ours
        run: |
          pattern='_GLIBCXX_ASSERTIONS|_LIBCPP_HARDENING_MODE'
          grep -qE "$pattern" build/compile_commands.json \
            || { echo "the library was built without standard-library hardening"; exit 1; }
          status=0
          grep -qE "$pattern" build/examples/compile_commands.json \
            "$RUNNER_TEMP"/prefix/lib*/cmake/snmpio/*.cmake || status=$?
          case $status in
            1) ;;
            0) echo "an installed consumer inherited standard-library hardening"; exit 1 ;;
            *) echo "nothing to check: the consumer's files are missing"; exit 1 ;;
          esac

  style:
    name: clang-format + clang-tidy
    runs-on: ubuntu-24.04
    # Both tools change their output between major versions, so this job uses the same LLVM as the
    # workstation, which is Arch: whatever Arch's `clang` package ships, following Arch rather than
    # pinning it. A pinned image would drift from the workstation at its next `pacman -Syu`. So a
    # new LLVM major reaches this job when Arch ships it, and may turn an unrelated PR red: what it
    # asks for lands in a commit of its own, not in that PR's work (CLAUDE.md).
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v5

      - name: Install clang and build dependencies
        run: |
          pacman -Syu --noconfirm --needed clang cmake ninja boost openssl gtest

      - name: Report tool versions
        run: |
          clang-format --version
          clang-tidy --version | head -2

      - name: Format
        run: |
          find include src tests fuzz examples -name '*.hpp' -o -name '*.cpp' \
            | xargs clang-format --dry-run --Werror

      # Static analysis, plus the naming convention the formatter cannot check. tests/ and fuzz/
      # carry their own overlay relaxing the checks that only make sense for library code.
      - name: clang-tidy
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=clang++
          clang-tidy -p build src/*.cpp tests/*.cpp fuzz/*.cpp
